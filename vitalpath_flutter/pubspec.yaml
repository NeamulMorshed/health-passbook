name: vitalpath
description: Omra - Health App for Patients and Doctors
publish_to: 'none'
version: 2.2.0+13

environment:
  # Bumped from 3.1.0 — firebase_core 3.x requires Dart >=3.2.0
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase — synchronized v3/v5 golden stack ──────────────────────────
  # This cohesive set ships firebase_auth_platform_interface 8.x which has
  # correctly generated Pigeon code. The PigeonUserDetails / PigeonUserInfo
  # type-cast crashes are permanently resolved at the source.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.1
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.2

  # ── State Management ─────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ───────────────────────────────────────────────────────────
  go_router: ^14.3.0

  # ── UI ───────────────────────────────────────────────────────────────────
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # ── Utilities ────────────────────────────────────────────────────────────
  intl: ^0.19.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  pedometer: ^4.0.0
  shared_preferences: ^2.3.2
  local_auth: ^2.3.0
  uuid: ^4.5.1
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  connectivity_plus: ^6.1.0
  timeago: ^3.7.0
  percent_indicator: ^4.2.3
  http: ^1.2.1
  google_mlkit_text_recognition: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  freezed: ^2.5.4
  json_serializable: ^6.8.0

# ── NO dependency_overrides ──────────────────────────────────────────────
# The google_sign_in_android 6.1.36 pin and the manual pub-cache patch to
# firebase_auth_platform_interface 7.3.0 are both removed. The v5 Firebase
# stack ships correctly generated Pigeon bridges that need no workarounds.

flutter:
  uses-material-design: true

  assets:
    - assets/data/
