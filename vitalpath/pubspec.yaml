name: vitalpath
description: VitalPath Health Passbook — A centralized health management app for patients, caregivers, and healthcare providers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Local Database (Drift / SQLite) ───────────────────────────
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── Navigation ────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Backend (Supabase) ────────────────────────────────────────
  supabase_flutter: ^2.5.6

  # ── Health Data (Android Health Connect) ──────────────────────
  health: ^10.2.0

  # ── Notifications & Alarms ───────────────────────────────────
  flutter_local_notifications: ^17.2.2
  flutter_timezone: ^1.0.9
  timezone: ^0.9.4
  awesome_notifications: ^0.9.3+1

  # ── Background Processing ─────────────────────────────────────
  workmanager: ^0.5.2

  # ── Authentication ────────────────────────────────────────────
  local_auth: ^2.3.0

  # ── Network & Connectivity ────────────────────────────────────
  connectivity_plus: ^6.0.5
  dio: ^5.5.0

  # ── QR Code ──────────────────────────────────────────────────
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # ── Animations (Rive — Zero CPU overhead) ────────────────────
  rive: ^0.13.10

  # ── UI & Design ───────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  flutter_slidable: ^3.1.1
  gap: ^3.0.1
  modal_bottom_sheet: ^3.0.0
  flutter_animate: ^4.5.0

  # ── Permissions ───────────────────────────────────────────────
  permission_handler: ^11.3.1

  # ── Image & Camera ───────────────────────────────────────────
  image_picker: ^1.1.2
  flutter_image_compress: ^2.2.0

  # ── Maps & Location (GPS Walk) ───────────────────────────────
  geolocator: ^12.0.0
  google_maps_flutter: ^2.9.0
  flutter_polyline_points: ^2.1.0

  # ── Utils ─────────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.4.2
  collection: ^1.18.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  package_info_plus: ^8.1.2
  encrypt: ^5.0.3
  crypto: ^3.0.5
  flutter_secure_storage: ^9.2.2

  # ── Phone Auth ────────────────────────────────────────────────
  pinput: ^4.0.0

  # ── Dev Tools ─────────────────────────────────────────────────
  logger: ^2.4.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - .env

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
